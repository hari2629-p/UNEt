[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-documenting-void"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "networkx>=3.0",
    "click>=8.1",
    "pytest>=7.4",
]

[project.scripts]
void = "void.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
